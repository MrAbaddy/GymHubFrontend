<mat-toolbar class="gymhub-navbar">
  <div class="brand-container">
    <div class="logo-circle-small">
      <mat-icon>fitness_center</mat-icon>
    </div>
    <span class="brand-name">GYMHUB</span>
  </div>

  <span class="spacer"></span>

  <div class="user-info" *ngIf="usuarioLogado">
    <span class="welcome-text">Olá, {{ usuarioLogado.email || usuarioLogado.sub }}</span>
  </div>

  <button mat-flat-button color="warn" (click)="logout()" class="logout-btn">
    <mat-icon>logout</mat-icon>
    SAIR
  </button>
</mat-toolbar>

<div class="dashboard-content">

  <div class="page-header">
    <h1>Usuários do Sistema</h1>
    <p>Gerencie o acesso à plataforma</p>
  </div>

  <div class="mat-elevation-z8 table-container">
    <table mat-table [dataSource]="dataSource">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let user"> #{{user.id}} </td>
      </ng-container>

      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let user"> {{user.nome || '---'}} </td>
      </ng-container>

      <ng-container matColumnDef="login">
        <th mat-header-cell *matHeaderCellDef> Email/Login </th>
        <td mat-cell *matCellDef="let user"> {{user.login}} </td>
      </ng-container>

      <ng-container matColumnDef="permissao">
        <th mat-header-cell *matHeaderCellDef> Permissão </th>
        <td mat-cell *matCellDef="let user">
          <span class="badge" [class.admin]="user.permissao === 'ADMIN'">
            {{user.permissao || 'USER'}}
          </span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

</div>
